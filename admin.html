<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ადმინ პანელი · Gentleman Barbershop</title>
<meta name="theme-color" content="#0e0d0c">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Georgian:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="mark" viewBox="0 0 48 48">
      <path d="M13.2 4.5h21.6l-1.5 11.2H14.7z"/>
      <path d="M14.95 17.6h18.1l-.45 3.3H15.4z"/>
      <rect x="6.5" y="22.2" width="35" height="3.6" rx="1.8"/>
      <path d="M24 33.9c2.2-2.7 5.6-3.3 8.2-1.7 2.3 1.4 4.6 1.5 6.8-.4-.6 4.7-4 7.6-8.3 7.4-2.9-.1-5.2-1.5-6.7-3.7-1.5 2.2-3.8 3.600-6.7 3.7-4.3.2-7.7-2.7-8.3-7.4 2.2 1.9 4.5 1.8 6.8.4 2.6-1.6 6-1 8.2 1.700z"/>
    </symbol>
  </defs>
</svg>

<!-- შესვლა -->
<main class="login" id="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <svg class="login-mark" aria-hidden="true"><use href="#mark"/></svg>
    <h1>ადმინ პანელი</h1>
    <p class="hint">Gentleman Barbershop — საიტის მართვა</p>
    <div class="f">
      <label for="pw">პაროლი</label>
      <div class="pw-row">
        <input id="pw" type="password" autocomplete="current-password" required aria-describedby="pw-err">
        <button type="button" class="ghost" id="pw-toggle" aria-pressed="false">ჩვენება</button>
      </div>
      <p class="err" id="pw-err" role="alert" hidden>პაროლი არასწორია. სცადე თავიდან.</p>
    </div>
    <button class="btn" type="submit">შესვლა</button>
    <a class="back" href="index.html">← საიტზე დაბრუნება</a>
  </form>
</main>

<!-- პანელი -->
<div class="app" id="app" hidden>
  <header class="top">
    <a class="top-brand" href="index.html" target="_blank" rel="noopener">
      <svg aria-hidden="true"><use href="#mark"/></svg><span>Gentleman <em>ადმინი</em></span>
    </a>
    <div class="top-end">
      <div class="seg" role="group" aria-label="რედაქტირების ენა">
        <span class="seg-label">ტექსტის ენა</span>
        <button type="button" data-elang="ka" aria-pressed="true">KA</button>
        <button type="button" data-elang="en" aria-pressed="false">EN</button>
        <button type="button" data-elang="ru" aria-pressed="false">RU</button>
      </div>
      <a class="ghost" href="index.html" target="_blank" rel="noopener">საიტის ნახვა ↗</a>
      <button class="ghost" type="button" id="logout">გასვლა</button>
    </div>
  </header>

  <div class="shell">
    <nav class="tabs" id="tabs" aria-label="განყოფილებები">
      <button type="button" data-tab="bookings">ჯავშნები <span class="badge" id="new-count" hidden></span></button>
      <button type="button" data-tab="slides">სლაიდები</button>
      <button type="button" data-tab="services">სერვისები და ფასები</button>
      <button type="button" data-tab="hours">საათები და კონტაქტი</button>
      <button type="button" data-tab="about">ბარბერები, ჩვენ შესახებ</button>
      <button type="button" data-tab="gallery">გალერეა</button>
      <button type="button" data-tab="reviews">შეფასებები</button>
      <button type="button" data-tab="data">მონაცემები</button>
    </nav>
    <main class="panel" id="panel" tabindex="-1"></main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-img" accept="image/*" hidden>
<input type="file" id="file-json" accept="application/json,.json" hidden>

<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
